# The getsentry fork runs Action Cable in-process in development, so the app starts
# without a Redis server (the onboarding evals' container has none).
development:
  adapter: async

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>
  channel_prefix: writebook_production
